name: SchemaGuard migration review

on:
  pull_request_target:
    paths:
      - "**/db/migration/**/*.sql"
      - "**/migrations/**/*.sql"
      - "**/schema/**/*.sql"
      - "**/schema.sql"
      - ".github/workflows/schemaguard-pr-review.yml"
      - "tools/schemaguard-cli.mjs"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      ${{
        vars.SCHEMAGUARD_API_URL != '' &&
        vars.SCHEMAGUARD_DATABASE_NAME != '' &&
        vars.SCHEMAGUARD_BASE_SCHEMA_FILE != '' &&
        vars.SCHEMAGUARD_MIGRATIONS_DIR != ''
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out pull request files as data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull-request
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Analyze Flyway migrations
        env:
          SCHEMAGUARD_API_URL: ${{ vars.SCHEMAGUARD_API_URL }}
          SCHEMAGUARD_DATABASE_NAME: ${{ vars.SCHEMAGUARD_DATABASE_NAME }}
          SCHEMAGUARD_BASE_SCHEMA_FILE: ${{ vars.SCHEMAGUARD_BASE_SCHEMA_FILE }}
          SCHEMAGUARD_MIGRATIONS_DIR: ${{ vars.SCHEMAGUARD_MIGRATIONS_DIR }}
          SCHEMAGUARD_API_TOKEN: ${{ secrets.SCHEMAGUARD_API_TOKEN }}
          SCHEMAGUARD_REPORT_PATH: ${{ runner.temp }}/schemaguard-report.md
        working-directory: pull-request
        run: node ../trusted/tools/schemaguard-cli.mjs > "$SCHEMAGUARD_REPORT_PATH"
      - name: Comment on pull request
        uses: actions/github-script@v7
        env:
          SCHEMAGUARD_REPORT_PATH: ${{ runner.temp }}/schemaguard-report.md
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- schemaguard-migration-review -->";
            const body = fs.readFileSync(process.env.SCHEMAGUARD_REPORT_PATH, "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
