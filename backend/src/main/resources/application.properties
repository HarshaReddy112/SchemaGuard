
spring.application.name=schemaguard

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/schemaguard?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:schemaguard_app}
spring.datasource.password=${DB_PASSWORD:tiger}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.sql.init.mode=never
